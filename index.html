<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toma – Grow Daily, Care Deeply</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: {
    mint: { 50:'#effaf4', 100:'#d8f3e4', 300:'#9fdcbc', 500:'#4fb88a', 700:'#2c7a5c' },
    sky:  { 100:'#dff0fb', 300:'#a9d6f2', 500:'#5aaee0' },
    butter: { 100:'#fff4c2', 300:'#ffe27a', 500:'#f5c518' },
    ink: '#2b4a42'
  },
  fontFamily: { display:['Fredoka','sans-serif'], body:['Nunito','sans-serif'] }
}}};
</script>
<style>
  body { font-family:'Nunito',sans-serif; color:#2b4a42; background:linear-gradient(160deg,#dff0fb 0%,#d8f3e4 55%,#fff4c2 100%); }
  .card { background:#fff; border-radius:24px; box-shadow:0 6px 18px rgba(44,122,92,.10); }
  .bounce { animation:bounce .7s ease; }
  .pop { animation:pop .35s ease; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-18px) rotate(-4deg)} 60%{transform:translateY(0) rotate(3deg)} 80%{transform:translateY(-6px)} }
  @keyframes pop { 0%{transform:scale(.6)} 70%{transform:scale(1.15)} 100%{transform:scale(1)} }
  @keyframes drop { from{opacity:0; transform:translate(-50%,-12px)} to{opacity:1; transform:translate(-50%,0)} }
  #toast { animation:drop .25s ease; }
  button:focus-visible, input:focus-visible { outline:3px solid #5aaee0; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { .bounce,.pop,#toast { animation:none; } }
</style>
</head>
<body class="min-h-screen">

<div id="app" class="relative flex flex-col w-full h-[100dvh] bg-mint-50">

  <!-- Top bar: title, desktop tabs, account, growth progress -->
  <header class="bg-gradient-to-b from-sky-100 to-mint-50 pt-[max(1rem,env(safe-area-inset-top))] pb-3">
    <div class="max-w-6xl mx-auto px-5 md:px-8">
      <div class="flex items-center justify-between gap-4">
        <div>
          <h1 class="font-display text-2xl md:text-3xl font-semibold leading-tight">Grow Daily, Care Deeply</h1>
          <p class="text-sm text-ink/70">Celebrate every tiny win</p>
        </div>
        <nav class="hidden md:flex gap-2" aria-label="Main">
          <button data-a="tab" data-v="home"   class="nav rounded-full px-4 py-2 text-sm font-bold hover:bg-white">🌱 Garden</button>
          <button data-a="tab" data-v="habits" class="nav rounded-full px-4 py-2 text-sm font-bold hover:bg-white">✅ Habits</button>
          <button data-a="tab" data-v="focus"  class="nav rounded-full px-4 py-2 text-sm font-bold hover:bg-white">⏱️ Focus</button>
          <button data-a="tab" data-v="mood"   class="nav rounded-full px-4 py-2 text-sm font-bold hover:bg-white">😊 Mood</button>
        </nav>
        <button id="authChip" data-a="auth" class="shrink-0 text-xs font-bold bg-white rounded-full px-3 py-1.5 shadow-sm"></button>
      </div>
      <div class="card mt-3 px-4 py-3">
        <div class="flex justify-between text-sm font-bold mb-1.5">
          <span>💧 Growth energy today</span><span id="energyText"></span>
        </div>
        <div class="h-3 rounded-full bg-sky-100 overflow-hidden">
          <div id="bar" class="h-full rounded-full bg-gradient-to-r from-sky-300 to-mint-500 transition-all duration-500" style="width:0%"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto">
    <div id="view" class="max-w-6xl mx-auto px-5 md:px-8 pb-8"></div>
  </main>

  <div id="toast" class="hidden fixed top-24 left-1/2 -translate-x-1/2 z-20 bg-ink text-white text-sm font-bold rounded-full px-4 py-2 shadow-lg whitespace-nowrap"></div>

  <!-- Bottom tabs on phones only -->
  <nav class="md:hidden grid grid-cols-4 gap-1 px-3 pt-2 pb-[max(.75rem,env(safe-area-inset-bottom))] bg-white border-t border-mint-100" aria-label="Main">
    <button data-a="tab" data-v="home"   class="nav rounded-2xl py-2 text-xs font-bold"><span class="block text-xl">🌱</span>Garden</button>
    <button data-a="tab" data-v="habits" class="nav rounded-2xl py-2 text-xs font-bold"><span class="block text-xl">✅</span>Habits</button>
    <button data-a="tab" data-v="focus"  class="nav rounded-2xl py-2 text-xs font-bold"><span class="block text-xl">⏱️</span>Focus</button>
    <button data-a="tab" data-v="mood"   class="nav rounded-2xl py-2 text-xs font-bold"><span class="block text-xl">😊</span>Mood</button>
  </nav>
</div>

<!-- Sign-in sheet (only used when Supabase is configured) -->
<dialog id="authDlg" class="rounded-3xl p-6 w-[320px] backdrop:bg-ink/40">
  <h2 class="font-display text-xl font-semibold mb-1">Save your garden</h2>
  <p class="text-sm text-ink/70 mb-4">Sign in to keep your habits and energy across devices.</p>
  <input id="email" type="email" placeholder="Email" autocomplete="email" class="w-full border border-mint-300 rounded-xl px-3 py-2 mb-2">
  <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" class="w-full border border-mint-300 rounded-xl px-3 py-2 mb-3">
  <p id="authMsg" class="text-sm text-mint-700 min-h-[1.25rem] mb-2"></p>
  <div class="flex gap-2">
    <button data-a="signin" class="flex-1 bg-mint-500 text-white font-bold rounded-xl py-2">Sign in</button>
    <button data-a="signup" class="flex-1 bg-butter-300 font-bold rounded-xl py-2">Create account</button>
  </div>
  <button data-a="closeAuth" class="w-full text-sm mt-3 text-ink/60">Close</button>
</dialog>

<script>
/* ============ 1. SUPABASE CONFIG (leave empty to run in local-only mode) ============ */
const SUPABASE_URL = '';       // e.g. https://xxxx.supabase.co
const SUPABASE_ANON_KEY = '';  // the public "anon" key from Project Settings → API
const sb = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ============ 2. STATE ============ */
const TODAY = new Date().toISOString().slice(0, 10);
const ICONS = { 1:'🥗', 2:'🚶‍♀️', 3:'💭', 4:'💧', 5:'🧘' };
const DEFAULT_HABITS = [
  { id:1, title:'Control carbohydrates',  energy:10 },
  { id:2, title:'Power walk 20 min',      energy:15 },
  { id:3, title:'Think of a good memory', energy:10 },
  { id:4, title:'Drink 6 glasses of water', energy:10 },
  { id:5, title:'Stretch for 5 minutes',  energy:5 }
];
const MOODS = [
  { k:'happy',   e:'😄', l:'Happy' },   { k:'relaxed', e:'😌', l:'Relaxed' },
  { k:'calm',    e:'🙂', l:'Calm' },    { k:'angry',   e:'😠', l:'Angry' },
  { k:'sad',     e:'😢', l:'Sad' }
];
const AFFIRMATIONS = [
  'I am allowed to grow at my own pace.',
  'Small steps still move me forward.',
  'I treat myself with the kindness I give others.',
  'My feelings are valid, and they will pass.',
  'I am doing better than I think.',
  'Rest is part of growing.',
  'Today I choose progress over perfect.',
  'I deserve care, starting with my own.'
];
const CATS = { Focus:25, Meditation:10, Reading:20 };

const S = { tab:'home', habits:DEFAULT_HABITS, done:new Set(), energy:0, mood:null, user:null, aff:new Date().getDate() % AFFIRMATIONS.length };
const T = { cat:'Focus', total:1500, left:1500, running:false, end:0, id:null };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cloud = () => sb && S.user;
const goal = () => S.habits.reduce((a, h) => a + h.energy, 0);
const dayEnergy = () => S.habits.filter(h => S.done.has(h.id)).reduce((a, h) => a + h.energy, 0);
const pct = () => Math.min(100, Math.round(dayEnergy() / (goal() || 1) * 100));

/* ============ 3. DATA LAYER (localStorage + optional Supabase) ============ */
function localLoad() {
  try {
    const d = JSON.parse(localStorage.getItem('toma-v1') || '{}');
    S.energy = d.energy || 0;
    if (d.date === TODAY) { S.done = new Set(d.done || []); S.mood = d.mood || null; }
  } catch (e) {}
}
function localSave() {
  try { localStorage.setItem('toma-v1', JSON.stringify({ date:TODAY, done:[...S.done], energy:S.energy, mood:S.mood })); } catch (e) {}
}
async function cloudLoad() {
  const [h, l, g, m] = await Promise.all([
    sb.from('habits').select('*').order('id'),
    sb.from('habit_logs').select('habit_id').eq('log_date', TODAY),
    sb.from('garden_stats').select('*').maybeSingle(),
    sb.from('moods').select('mood').gte('created_at', TODAY).order('created_at', { ascending:false }).limit(1)
  ]);
  if (h.data && h.data.length) S.habits = h.data;
  S.done = new Set((l.data || []).map(r => r.habit_id));
  S.energy = g.data ? g.data.energy : 0;
  S.mood = m.data && m.data[0] ? m.data[0].mood : null;
}
const saveEnergy = () => sb.from('garden_stats').upsert({ user_id:S.user.id, energy:S.energy, updated_at:new Date().toISOString() });
async function guard(p) {
  try { const r = await p; if (r && r.error) throw r.error; } catch (e) { toast('Couldn’t sync: ' + (e.message || 'try again')); }
}

/* ============ 4. UI HELPERS ============ */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  t.style.animation = 'none'; t.offsetHeight; t.style.animation = '';
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.add('hidden'), 2200);
}
function cheer(msg) {
  toast(msg);
  const el = $('#toma'); if (el) { el.classList.remove('bounce'); el.offsetHeight; el.classList.add('bounce'); }
}
function toma(size = 'w-36 h-36') {
  const mood = S.mood;
  const mouth = mood === 'sad' ? 'M42 71 Q50 64 58 71' : mood === 'angry' ? 'M43 69 H57' : 'M42 64 Q50 75 58 64';
  const brows = mood === 'angry' ? '<path d="M29 45 L42 50 M71 45 L58 50" stroke="#2b4a42" stroke-width="3" stroke-linecap="round"/>' : '';
  return `<svg id="toma" viewBox="0 0 100 100" class="${size}" role="img" aria-label="Toma the yellow tomato">
    <path d="M50 24 C44 10 34 10 29 15 C38 15 44 19 50 24 C56 19 62 15 71 15 C66 10 56 10 50 24Z" fill="#4fb88a"/>
    <rect x="48" y="12" width="4" height="13" rx="2" fill="#2c7a5c"/>
    <ellipse cx="50" cy="59" rx="40" ry="35" fill="#ffd84d"/>
    <ellipse cx="33" cy="44" rx="8" ry="5" fill="#fff" opacity=".45"/>
    <circle cx="36" cy="56" r="4.5" fill="#2b4a42"/><circle cx="64" cy="56" r="4.5" fill="#2b4a42"/>
    <circle cx="37.5" cy="54.5" r="1.4" fill="#fff"/><circle cx="65.5" cy="54.5" r="1.4" fill="#fff"/>
    <ellipse cx="26" cy="66" rx="6" ry="4" fill="#ff9aa2" opacity=".6"/><ellipse cx="74" cy="66" rx="6" ry="4" fill="#ff9aa2" opacity=".6"/>
    ${brows}<path d="${mouth}" stroke="#2b4a42" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
}
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

/* ============ 5. VIEWS ============ */
function habitRow(h) {
  const on = S.done.has(h.id);
  return `<div class="card flex items-center gap-3 px-4 py-3 ${on ? 'bg-mint-100' : ''}" style="${on ? 'background:#d8f3e4' : ''}">
    <span class="text-2xl">${ICONS[h.id] || h.icon || '🌟'}</span>
    <div class="flex-1 min-w-0">
      <p class="font-bold ${on ? 'line-through opacity-60' : ''}">${esc(h.title)}</p>
      <p class="text-xs text-ink/60">+${h.energy} 💧</p>
    </div>
    <button data-a="toggle" data-v="${h.id}" aria-pressed="${on}" aria-label="${on ? 'Undo' : 'Complete'} ${esc(h.title)}"
      class="w-10 h-10 rounded-full border-2 text-lg font-bold ${on ? 'bg-mint-500 border-mint-500 text-white pop' : 'border-mint-300 bg-white text-transparent'}">✓</button>
  </div>`;
}
function homeView() {
  const plants = Math.min(12, Math.floor(S.energy / 20));
  const stages = ['🌱', '🌿', '🌷', '🌻', '🍅'];
  const slots = Array.from({ length:12 }, (_, i) => i < plants
    ? `<span class="text-4xl pop">${stages[i % 5]}</span>` : `<span class="text-xl opacity-25">🟤</span>`).join('');
  const msg = pct() === 0 ? 'Hi! Let’s water your garden today.'
    : pct() < 100 ? `Nice work! ${goal() - dayEnergy()} more energy to a full day.`
    : 'All done! Your garden is glowing today. ✨';
  const stat = (v, l) => `<div class="bg-butter-100 rounded-2xl py-2"><p class="font-display text-xl font-semibold">${v}</p><p class="text-xs text-ink/70">${l}</p></div>`;
  return `<div class="grid md:grid-cols-[340px_1fr] gap-5 mt-2">
    <section class="card p-6 flex flex-col items-center text-center self-start">
      ${toma('w-40 h-40')}
      <p class="font-bold mt-3">${msg}</p>
      <div class="w-full grid grid-cols-3 gap-2 mt-4">${stat(Math.floor(S.energy / 100) + 1, 'Level')}${stat(S.energy, 'Total 💧')}${stat(S.done.size + '/' + S.habits.length, 'Habits')}</div>
    </section>
    <div class="space-y-5">
      <section class="card p-5">
        <h2 class="font-display text-lg font-medium mb-3">My garden</h2>
        <div class="grid grid-cols-4 sm:grid-cols-6 gap-3 place-items-center bg-butter-100 rounded-2xl py-5">${slots}</div>
        <p class="text-xs text-ink/60 mt-2">Every 20 energy grows a new plant.</p>
      </section>
      <section>
        <h2 class="font-display text-lg font-medium mb-2">Up next</h2>
        <div class="grid sm:grid-cols-2 gap-2">${S.habits.filter(h => !S.done.has(h.id)).slice(0, 4).map(habitRow).join('') || '<p class="card p-4 text-sm">Every habit is done. Take a deep breath. 🌸</p>'}</div>
      </section>
    </div>
  </div>`;
}
function habitsView() {
  return `<h2 class="font-display text-xl font-medium mt-2 mb-3">Today’s habits</h2>
    <div class="grid md:grid-cols-2 gap-3">${S.habits.map(habitRow).join('')}</div>
    <p class="text-center text-sm text-ink/60 mt-4">${S.done.size} of ${S.habits.length} done</p>`;
}
function focusView() {
  return `<div class="max-w-xl mx-auto"><div class="flex justify-center gap-2 mt-2">${Object.keys(CATS).map(c =>
    `<button data-a="cat" data-v="${c}" class="px-4 py-1.5 rounded-full text-sm font-bold ${T.cat === c ? 'bg-sky-300' : 'bg-white'}">${c}</button>`).join('')}</div>
  <div class="card mt-4 py-10 flex flex-col items-center">
    <div class="relative w-64 h-64">
      <svg viewBox="0 0 200 200" class="w-full h-full -rotate-90">
        <circle cx="100" cy="100" r="88" fill="none" stroke="#dff0fb" stroke-width="12"/>
        <circle id="ring" cx="100" cy="100" r="88" fill="none" stroke="#4fb88a" stroke-width="12" stroke-linecap="round" stroke-dasharray="553"/>
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span id="time" class="font-display text-6xl font-semibold"></span>
        <span class="text-sm text-ink/60">${T.cat}</span>
      </div>
    </div>
    <div class="flex gap-3 mt-6">
      <button id="sbtn" data-a="startpause" class="px-8 py-3 rounded-2xl bg-mint-500 text-white font-bold text-lg"></button>
      <button data-a="reset" class="px-5 py-3 rounded-2xl bg-butter-300 font-bold">Reset</button>
    </div>
    <p class="text-xs text-ink/60 mt-4">Finish a session to earn +15 💧</p>
  </div></div>`;
}
function moodView() {
  return `<div class="grid md:grid-cols-2 gap-5 mt-2">
  <section>
    <h2 class="font-display text-xl font-medium mb-3">How are you feeling?</h2>
    <div class="grid grid-cols-5 gap-2">${MOODS.map(m =>
      `<button data-a="mood" data-v="${m.k}" aria-pressed="${S.mood === m.k}" class="card py-4 flex flex-col items-center gap-1 text-xs sm:text-sm font-bold ${S.mood === m.k ? 'ring-4 ring-sky-300' : ''}">
        <span class="text-3xl sm:text-4xl">${m.e}</span>${m.l}</button>`).join('')}</div>
    <div class="flex justify-center mt-6">${toma('w-32 h-32')}</div>
  </section>
  <section class="rounded-3xl p-8 text-center bg-gradient-to-br from-butter-100 to-mint-100 shadow-sm self-start">
    <p class="text-sm font-bold text-mint-700">Today’s affirmation</p>
    <p class="font-display text-3xl leading-snug mt-3">“${esc(AFFIRMATIONS[S.aff])}”</p>
    <button data-a="shuffle" class="mt-5 text-sm font-bold bg-white rounded-full px-4 py-1.5">Show another</button>
  </section></div>`;
}

function render() {
  $('#energyText').textContent = `${dayEnergy()} / ${goal()}`;
  $('#bar').style.width = pct() + '%';
  $('#authChip').textContent = !sb ? '📴 Local mode' : S.user ? 'Sign out' : 'Sign in';
  $('#view').innerHTML = ({ home:homeView, habits:habitsView, focus:focusView, mood:moodView })[S.tab]();
  document.querySelectorAll('.nav').forEach(b => {
    const on = b.dataset.v === S.tab;
    b.classList.toggle('bg-mint-100', on); b.classList.toggle('text-mint-700', on);
  });
  if (S.tab === 'focus') paintTimer();
}

/* ============ 6. TIMER ============ */
function paintTimer() {
  const t = $('#time'); if (!t) return;
  t.textContent = fmt(T.left);
  $('#ring').style.strokeDashoffset = 553 * (1 - T.left / T.total);
  $('#sbtn').textContent = T.running ? 'Pause' : (T.left < T.total ? 'Resume' : 'Start');
}
function tick() {
  T.left = Math.max(0, Math.round((T.end - Date.now()) / 1000));
  paintTimer();
  if (T.left === 0) finishTimer();
}
function stopTimer() { clearInterval(T.id); T.running = false; }
async function finishTimer() {
  stopTimer();
  S.energy += 15; S.mood = S.mood; localSave();
  const mins = CATS[T.cat];
  T.left = T.total;
  render(); toast(`${T.cat} complete! +15 💧`);
  if (cloud()) {
    await guard(sb.from('focus_sessions').insert({ user_id:S.user.id, category:T.cat, minutes:mins }));
    await guard(saveEnergy());
  }
}

/* ============ 7. ACTIONS ============ */
const actions = {
  tab: v => { S.tab = v; render(); $('#view').parentElement.scrollTop = 0; },
  async toggle(v) {
    const id = Number(v), h = S.habits.find(x => x.id === id); if (!h) return;
    const on = !S.done.has(id);
    on ? S.done.add(id) : S.done.delete(id);
    S.energy = Math.max(0, S.energy + (on ? h.energy : -h.energy));
    localSave(); render();
    if (on) cheer(pct() === 100 ? 'All habits done! 🎉' : `+${h.energy} 💧 Nice!`);
    if (cloud()) {
      await guard(on
        ? sb.from('habit_logs').insert({ user_id:S.user.id, habit_id:id, log_date:TODAY })
        : sb.from('habit_logs').delete().match({ user_id:S.user.id, habit_id:id, log_date:TODAY }));
      await guard(saveEnergy());
    }
  },
  cat: v => { stopTimer(); T.cat = v; T.total = T.left = CATS[v] * 60; render(); },
  startpause() {
    if (T.running) { stopTimer(); }
    else { T.end = Date.now() + T.left * 1000; T.running = true; T.id = setInterval(tick, 250); }
    paintTimer();
  },
  reset() { stopTimer(); T.left = T.total; paintTimer(); },
  async mood(v) {
    S.mood = v; localSave(); render();
    toast(`Logged: ${MOODS.find(m => m.k === v).l}`);
    if (cloud()) await guard(sb.from('moods').insert({ user_id:S.user.id, mood:v }));
  },
  shuffle() { S.aff = (S.aff + 1) % AFFIRMATIONS.length; render(); },
  async auth() {
    if (!sb) return toast('Add your Supabase keys to enable sign-in');
    if (S.user) { await sb.auth.signOut(); S.user = null; localLoad(); render(); return toast('Signed out'); }
    $('#authMsg').textContent = ''; $('#authDlg').showModal();
  },
  closeAuth: () => $('#authDlg').close(),
  async signin() {
    const { error } = await sb.auth.signInWithPassword({ email:$('#email').value, password:$('#pass').value });
    if (error) return ($('#authMsg').textContent = error.message);
    await afterAuth();
  },
  async signup() {
    const { data, error } = await sb.auth.signUp({ email:$('#email').value, password:$('#pass').value });
    if (error) return ($('#authMsg').textContent = error.message);
    if (data.session) await afterAuth(); else $('#authMsg').textContent = 'Check your email to confirm, then sign in.';
  }
};
async function afterAuth() {
  const { data } = await sb.auth.getSession();
  S.user = data.session ? data.session.user : null;
  if (S.user) await cloudLoad();
  $('#authDlg').close(); render(); toast('Welcome back! 🌱');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (b && actions[b.dataset.a]) actions[b.dataset.a](b.dataset.v);
});

/* ============ 8. START ============ */
localLoad(); render();
if (sb) sb.auth.getSession().then(async ({ data }) => {
  S.user = data.session ? data.session.user : null;
  if (S.user) { await cloudLoad(); render(); }
});
</script>
</body>
</html>
