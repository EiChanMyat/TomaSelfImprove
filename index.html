<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toma – Grow Daily, Care Deeply</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: {
    mint: { 50:'#effaf4', 100:'#d8f3e4', 300:'#9fdcbc', 500:'#4fb88a', 700:'#2c7a5c' },
    sky:  { 100:'#dff0fb', 300:'#a9d6f2', 500:'#5aaee0' },
    butter: { 100:'#fff4c2', 300:'#ffe27a', 500:'#f5c518' },
    ink: '#2b4a42'
  },
  fontFamily: { display:['Fredoka','sans-serif'], body:['Nunito','sans-serif'] }
}}};
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen">

<div id="app" class="relative flex flex-col w-full h-[100dvh] bg-mint-50">

  <!-- Top bar: title, desktop tabs, account, growth progress -->
  <header class="bg-gradient-to-b from-sky-100 to-mint-50 pt-[max(1rem,env(safe-area-inset-top))] pb-3">
    <div class="max-w-6xl mx-auto px-5 md:px-8">
      <div class="flex items-center justify-between gap-4">
        <div>
          <h1 class="font-display text-2xl md:text-3xl font-semibold leading-tight">Grow Daily, Care Deeply</h1>
          <p class="text-sm text-ink/70">Celebrate every tiny win</p>
        </div>
        
        <div class="shrink-0 flex items-center gap-2">
          <span id="acct" class="text-xs bg-white/70 rounded-full px-3 py-1.5 max-w-[140px] sm:max-w-[240px] truncate" title="Current account"></span>
          <button id="authChip" data-a="auth" class="text-xs font-bold bg-white rounded-full px-3 py-1.5 shadow-sm"></button>
        </div>
      </div>
      <nav class="hidden md:flex flex-wrap gap-2 mt-3" aria-label="Main">
          <button data-a="tab" data-v="home"   class="nav rounded-full px-4 py-2 text-sm font-bold hover:bg-white">🌱 Garden</button>
          <button data-a="tab" data-v="habits" class="nav rounded-full px-4 py-2 text-sm font-bold hover:bg-white">✅ Habits</button>
          <button data-a="tab" data-v="progress" class="nav rounded-full px-4 py-2 text-sm font-bold hover:bg-white">📈 Progress</button>
          <button data-a="tab" data-v="focus"  class="nav rounded-full px-4 py-2 text-sm font-bold hover:bg-white">⏱️ Focus</button>
          <button data-a="tab" data-v="mood"   class="nav rounded-full px-4 py-2 text-sm font-bold hover:bg-white">😊 Mood</button>
          <button data-a="tab" data-v="todo" class="nav rounded-full px-4 py-2 text-sm font-bold hover:bg-white">📝 To-do</button>
        </nav>
      <div class="card mt-3 px-4 py-3">
        <div class="flex justify-between text-sm font-bold mb-1.5">
          <span>💧 Growth energy today</span><span id="energyText"></span>
        </div>
        <div class="h-3 rounded-full bg-sky-100 overflow-hidden">
          <div id="bar" class="h-full rounded-full bg-gradient-to-r from-sky-300 to-mint-500 transition-all duration-500" style="width:0%"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto">
    <div id="view" class="max-w-6xl mx-auto px-5 md:px-8 pb-8"></div>
  </main>

  <div id="toast" class="hidden fixed top-24 left-1/2 -translate-x-1/2 z-20 bg-ink text-white text-sm font-bold rounded-full px-4 py-2 shadow-lg whitespace-nowrap"></div>

  <!-- Bottom tabs on phones only -->
  <nav class="md:hidden grid grid-cols-6 gap-0.5 px-3 pt-2 pb-[max(.75rem,env(safe-area-inset-bottom))] bg-white border-t border-mint-100" aria-label="Main">
    <button data-a="tab" data-v="home"   class="nav rounded-2xl py-2 text-xs font-bold"><span class="block text-xl">🌱</span>Garden</button>
    <button data-a="tab" data-v="habits" class="nav rounded-2xl py-2 text-xs font-bold"><span class="block text-xl">✅</span>Habits</button>
    <button data-a="tab" data-v="progress" class="nav rounded-2xl py-2 text-xs font-bold"><span class="block text-xl">📈</span>Progress</button>
    <button data-a="tab" data-v="focus"  class="nav rounded-2xl py-2 text-xs font-bold"><span class="block text-xl">⏱️</span>Focus</button>
    <button data-a="tab" data-v="mood"   class="nav rounded-2xl py-2 text-xs font-bold"><span class="block text-xl">😊</span>Mood</button>
    <button data-a="tab" data-v="todo" class="nav rounded-2xl py-2 text-xs font-bold"><span class="block text-xl">📝</span>To-do</button>
  </nav>
</div>

<!-- Sign-in sheet (only used when Supabase is configured) -->
<dialog id="authDlg" class="rounded-3xl p-6 w-[320px] backdrop:bg-ink/40">
  <h2 class="font-display text-xl font-semibold mb-1">Save your garden</h2>
  <p class="text-sm text-ink/70 mb-4">Sign in to keep your habits and energy across devices.</p>
  <input id="email" type="email" placeholder="Email" autocomplete="email" class="w-full border border-mint-300 rounded-xl px-3 py-2 mb-2">
  <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" class="w-full border border-mint-300 rounded-xl px-3 py-2 mb-3">
  <p id="authMsg" class="text-sm text-mint-700 min-h-[1.25rem] mb-2"></p>
  <div class="flex gap-2">
    <button data-a="signin" class="flex-1 bg-mint-500 text-white font-bold rounded-xl py-2">Sign in</button>
    <button data-a="signup" class="flex-1 bg-butter-300 font-bold rounded-xl py-2">Create account</button>
  </div>
  <button data-a="closeAuth" class="w-full text-sm mt-3 text-ink/60">Close</button>
</dialog>

<!-- Add / edit focus -->
<dialog id="focusDlg" class="rounded-3xl p-6 w-[320px] backdrop:bg-ink/40">
  <h2 id="focusDlgTitle" class="font-display text-xl font-semibold mb-3">New focus</h2>
  <label class="text-sm font-bold" for="fName">Name</label>
  <input id="fName" maxlength="30" placeholder="e.g. Cleaning" class="w-full border border-mint-300 rounded-xl px-3 py-2 mt-1 mb-3">
  <label class="text-sm font-bold" for="fMinutes">Minutes (1 to 180)</label>
  <input id="fMinutes" type="number" min="1" max="180" class="w-full border border-mint-300 rounded-xl px-3 py-2 mt-1 mb-3">
  <p id="fMsg" class="text-sm text-red-600 min-h-[1.25rem] mb-2"></p>
  <div class="flex gap-2">
    <button data-a="saveFocus" class="flex-1 bg-mint-500 text-white font-bold rounded-xl py-2">Save</button>
    <button data-a="closeFocus" class="flex-1 bg-butter-300 font-bold rounded-xl py-2">Cancel</button>
  </div>
  <button id="fDelete" data-a="deleteFocus" class="hidden w-full text-sm mt-3 text-red-600 font-bold">Delete this focus</button>
</dialog>

<!-- Add / edit habit -->
<dialog id="habitDlg" class="rounded-3xl p-6 w-[320px] backdrop:bg-ink/40">
  <h2 id="habitTitle" class="font-display text-xl font-semibold mb-3">New habit</h2>
  <label class="text-sm font-bold" for="hTitle">Habit name</label>
  <input id="hTitle" maxlength="60" placeholder="e.g. Read 10 pages" class="w-full border border-mint-300 rounded-xl px-3 py-2 mt-1 mb-3">
  <div class="grid grid-cols-2 gap-3 mb-3">
    <div><label class="text-sm font-bold" for="hEnergy">Reward</label>
      <select id="hEnergy" class="w-full border border-mint-300 rounded-xl px-3 py-2 mt-1 bg-white"><option value="5">5 💧 small</option><option value="10">10 💧 medium</option><option value="15">15 💧 big</option></select></div>
    <div><label class="text-sm font-bold" for="hIcon">Icon</label>
      <select id="hIcon" class="w-full border border-mint-300 rounded-xl px-3 py-2 mt-1 bg-white"><option>🌟</option><option>🥗</option><option>💭</option><option>🚶‍♀️</option><option>💧</option><option>📚</option><option>🧘</option><option>😴</option><option>💪</option><option>🎨</option><option>🌿</option></select></div>
  </div>
  <p id="hMsg" class="text-sm text-red-600 min-h-[1.25rem] mb-2"></p>
  <div class="flex gap-2">
    <button data-a="saveHabit" class="flex-1 bg-mint-500 text-white font-bold rounded-xl py-2">Save</button>
    <button data-a="closeHabit" class="flex-1 bg-butter-300 font-bold rounded-xl py-2">Cancel</button>
  </div>
  <button id="hDelete" data-a="deleteHabit" class="hidden w-full text-sm mt-3 text-red-600 font-bold">Delete habit</button>
</dialog>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
